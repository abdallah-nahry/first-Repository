<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <h1>ICR Company</h1>
    <h2>We have all kind of laptop . . .</h2>
    <div class="links-page">
      <a href="index.html">Home page</a>
      <a href="login.html">login </a>
    </div>
    <form action="" method="" enctype="multipart/form-data">
      <fieldset>
        <legend class="H-form">personal information</legend>
        <div>
          <label for="username">user name : </label>
          <input type="text" name="" id="username" />
        </div>

        <div>
          <label for="userage">user age : </label><br />
          <input type="number" name="" id="userage" max="30" min="18" />
        </div>

        <div>
          <label for="useremail">user Email : </label>
          <input type="email" name="" id="useremail" />
        </div>

        <div>
          <label for="userpassword">user password : </label>
          <input type="password" name="" id="userpassword" />
        </div>

        <div>
          <label for="userdate">user date : </label><br />
          <input type="date" name="" id="userdate" />
        </div>

        <div>
          <label for="userbiography">user Biography : </label><br />
          <input type="file" name="" id="userbiography" />
        </div>
        <div class="p-but">
          <button class="but">submit</button>
          <button class="but">reset</button>
        </div>
      </fieldset>
    </form>
  </body>
</html>
